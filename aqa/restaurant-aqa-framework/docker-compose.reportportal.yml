# Report Portal v5 Local Stack
# Usage: docker compose -f docker-compose.reportportal.yml up -d
# Web UI: http://localhost:8080 (default credentials: superadmin / erebus)

services:
  gateway:
    image: traefik:v2.10
    ports:
      - "8080:8080"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - service-ui
      - service-api

  service-ui:
    image: reportportal/service-ui:5.11.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ui.entrypoints=web"
      - "traefik.http.services.ui.loadbalancer.server.port=8080"

  service-api:
    image: reportportal/service-api:5.11.0
    environment:
      - RP_DB_HOST=postgres
      - RP_DB_PORT=5432
      - RP_DB_NAME=reportportal
      - RP_DB_USER=rpuser
      - RP_DB_PASS=rppass
      - RP_AMQP_HOST=rabbitmq
      - RP_AMQP_PORT=5672
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8585"
    depends_on:
      - postgres
      - rabbitmq

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=reportportal
      - POSTGRES_USER=rpuser
      - POSTGRES_PASSWORD=rppass
    volumes:
      - rp-pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=rabbitmq
      - RABBITMQ_DEFAULT_PASS=rabbitmq
    volumes:
      - rp-rabbitmq:/var/lib/rabbitmq

volumes:
  rp-pgdata:
  rp-rabbitmq:
